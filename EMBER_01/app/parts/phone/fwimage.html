<script>
// ─── The phone's full update: a FAT drive image of the pad's files, sent with the CircuitPython firmware as two
// UF2 files through the RP2040's boot ROM (always there: it can't be overwritten), so the firmware, the wipe and
// the files land in one go, from any state. From FIRMWARE_04's phone page (tested on the pads), unchanged. No page
// parts are used in here: tools/dev/tests/phone_image.mjs runs it on a computer. ───
const FS_BASE = 0x10100000;             // the CIRCUITPY drive on an RP2040: 1 MB in (CircuitPython's
                                        // 1020 KB firmware + 4 KB NVM come first)
const UF2_FAMILY = 0xE48BFF56;          // RP2040
const STOCK_BOOT = {'boot.bmp': '0ad955196ece9536d99051ee77040edf57a603f4', 'startup.bmp': '16fc95913f124a0112d736a4cae48cee4666c501'};

// a zip's files (stored or deflated)
function readZipBytes(buf) {
    const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
    let end = -1;
    for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { end = i; break; }
    if (end < 0) throw new Error('not a zip file');
    const count = dv.getUint16(end + 10, true), out = [];
    let p = dv.getUint32(end + 16, true);
    for (let n = 0; n < count; n++) {
        if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('the zip is damaged');
        const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), size = dv.getUint32(p + 24, true);
        const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), local = dv.getUint32(p + 42, true);
        const name = new TextDecoder().decode(buf.subarray(p + 46, p + 46 + nlen)).replace(/\\/g, '/');
        p += 46 + nlen + xlen + clen;
        if (name.endsWith('/')) continue;
        const start = local + 30 + dv.getUint16(local + 26, true) + dv.getUint16(local + 28, true);
        out.push({name, method, size, data: buf.subarray(start, start + csize)});
    }
    return out;
}
async function unzipEntry(e) {
    if (e.method === 0) return e.data;
    if (e.method !== 8) throw new Error(`${e.name} is packed in a way the page can't read`);
    const stream = new Blob([e.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
}
// An update package (tools/cpbuild/frozen_drive.py): mp1_package.json, firmware.uf2, drive/...
async function readPackage(bytes, source) {
    const entries = readZipBytes(bytes);
    const get = name => entries.find(e => e.name === name);
    const man = get('mp1_package.json');
    let info;
    try { info = JSON.parse(new TextDecoder().decode(await unzipEntry(man))); } catch (e) { info = null; }
    if (!info || !info.mp1_package || !get(info.uf2)) throw new Error('not an MP1 update package (no mp1_package.json / firmware in it)');
    const drive = [];
    for (const e of entries) if (e.name.startsWith('drive/') && e.name.length > 6) drive.push({path: e.name.slice(6), data: await unzipEntry(e)});
    if (!drive.some(f => f.path === 'code.py') || !drive.some(f => f.path === 'boot.py')) throw new Error('the package has no code.py / boot.py');
    return {info, source, uf2: await unzipEntry(get(info.uf2)), drive};
}

// an old wiring.py -> wiring.json (null if it can't be read with confidence)
function wiringFromPy(text) {
    const OLD = {ROWS: 'rows', COLS: 'cols', ENC_A: 'encoder_a', ENC_B: 'encoder_b', ENC_SW: 'encoder_button', I2C_SDA: 'i2c_sda', I2C_SCL: 'i2c_scl',
                 OLED_ADDRESS: 'oled_address', I2C_FREQUENCY: 'i2c_frequency', LED_STRIP_PIN: 'led_strip', BUZZER_PIN: 'buzzer'};
    const out = {};
    for (const [old, key] of Object.entries(OLD)) {
        const m = new RegExp('^\\s*' + old + '\\s*=\\s*([^#\\n]+)', 'm').exec(text);
        if (!m) continue;
        const v = m[1].trim();
        if (/^[\[(]/.test(v)) out[key] = [...v.matchAll(/GP(\d+)/g)].map(x => 'GP' + x[1]);
        else if (/GP\d+/.test(v)) out[key] = 'GP' + /GP(\d+)/.exec(v)[1];
        else if (v === 'None') out[key] = null;
        else if (/^0x[0-9a-f]+$/i.test(v)) out[key] = v;
        else if (/^\d+$/.test(v)) out[key] = key === 'oled_address' ? '0x' + (+v).toString(16).toUpperCase() : +v;
        else return null;
    }
    // wiring.py files are older than the add-ons: one it doesn't name isn't fitted (left out, the
    // firmware would assume the standard pin)
    for (const key of ['led_strip', 'buzzer']) if (!(key in out)) out[key] = null;
    return out.rows && out.cols && out.rows.length && out.cols.length ? out : null;
}

// The drive's size from os.statvfs (cluster size, data clusters): which flash chip the board has
function flashFromStatvfs(frsize, blocks) {
    const data = frsize * blocks;
    for (const mb of [2, 4, 8, 16, 32]) {
        const vol = (mb - 1) * 1048576;
        if (vol >= data && data >= vol * 0.85) return mb;
    }
    return 0;
}

// A FAT16 drive of these files ({path, data}; folders: {path, dir: true}), sized for a board with
// flashMB of flash. Only the sectors that matter are made: [[first sector, bytes], ...] runs.
function fatImage(files, flashMB, label, now = new Date()) {
    const sectors = (flashMB - 1) * 2048;
    let L = null;
    for (let spc = 1; spc <= 64 && !L; spc *= 2) {
        let fat = 1, cl;
        for (;;) {
            cl = Math.floor((sectors - 1 - fat - 32) / spc);
            const need = Math.ceil((cl + 2) * 2 / 512);
            if (need <= fat) break;
            fat = need;
        }
        if (cl < 4085) throw new Error('the drive is too small for this updater');
        if (cl < 65525) L = {spc, fat, clusters: cl, dataStart: 1 + fat + 32};
    }
    const cb = L.spc * 512;
    const date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
    const time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
    // the folder tree
    const mkdir = (name, parent) => ({name, parent, kids: new Map(), dir: true});
    const root = mkdir('', null);
    const dirOf = parts => {
        let d = root;
        for (const part of parts) {
            if (!d.kids.has(part)) d.kids.set(part, mkdir(part, d));
            d = d.kids.get(part);
            if (!d.dir) throw new Error(part + ' is both a file and a folder');
        }
        return d;
    };
    for (const f of files) {
        const parts = f.path.split('/').filter(Boolean);
        if (f.dir) { dirOf(parts); continue; }
        const d = dirOf(parts.slice(0, -1));
        d.kids.set(parts[parts.length - 1], {name: parts[parts.length - 1], data: f.data, dir: false});
    }
    // names: 8.3 short names (+ long-name entries when needed)
    const OK83 = /^[A-Z0-9_\-~!#$%&'(){}^@`]{1,8}(\.[A-Z0-9_\-~!#$%&'(){}^@`]{1,3})?$/;
    const clean = s => s.toUpperCase().replace(/[ .]/g, '').replace(/[^A-Z0-9_\-~!#$%&'(){}^@`]/g, '_');
    const nameDir = d => {
        const used = new Set();
        let count = d === root ? 1 : 2;                     // the label / "." and ".."
        for (const k of d.kids.values()) {
            let short;
            if (OK83.test(k.name) && !used.has(k.name)) { short = k.name; k.lfn = 0; }
            else {
                const dot = k.name.lastIndexOf('.');
                const base = clean(dot > 0 ? k.name.slice(0, dot) : k.name) || '_', ext = dot > 0 ? clean(k.name.slice(dot + 1)).slice(0, 3) : '';
                for (let n = 1; ; n++) {
                    const tail = '~' + n;
                    short = base.slice(0, 8 - tail.length) + tail + (ext ? '.' + ext : '');
                    if (!used.has(short)) break;
                }
                k.lfn = Math.ceil(k.name.length / 13);
            }
            used.add(short);
            const [b, e = ''] = short.split('.');
            k.sfn = (b.padEnd(8) + e.padEnd(3)).slice(0, 11);
            count += 1 + k.lfn;
            if (k.dir) nameDir(k);
        }
        d.entries = count;
    };
    nameDir(root);
    if (root.entries > 512) throw new Error('too many files in the top folder');
    // clusters: folders first (breadth first), then files
    const fat = new Uint16Array(L.clusters + 2);
    fat[0] = 0xFFF8; fat[1] = 0xFFFF;
    let next = 2;
    const alloc = bytes => {
        const n = Math.ceil(bytes / cb);
        if (!n) return 0;
        if (next + n > L.clusters + 2) throw new Error('the files don\'t fit on the drive');
        const start = next;
        for (let c = start; c < start + n; c++) fat[c] = c + 1 < start + n ? c + 1 : 0xFFFF;
        next += n;
        return start;
    };
    const dirs = [], all = [];
    const walk = d => { for (const k of d.kids.values()) { all.push(k); if (k.dir) { dirs.push(k); } } for (const k of d.kids.values()) if (k.dir) walk(k); };
    walk(root);
    for (const d of dirs) d.cluster = alloc(d.entries * 32);
    for (const k of all) if (!k.dir) k.cluster = alloc(k.data.length);
    // the directory tables
    const ascii = (b, at, s) => { for (let i = 0; i < s.length; i++) b[at + i] = s.charCodeAt(i); };
    const entry = (b, at, sfn, attr, cluster, size) => {
        ascii(b, at, sfn);
        b[at + 11] = attr;
        const dv = new DataView(b.buffer, b.byteOffset + at, 32);
        dv.setUint16(14, time, true); dv.setUint16(16, date, true); dv.setUint16(18, date, true);
        dv.setUint16(22, time, true); dv.setUint16(24, date, true); dv.setUint16(26, cluster, true); dv.setUint32(28, size, true);
    };
    const checksum = sfn => { let s = 0; for (let i = 0; i < 11; i++) s = (((s & 1) << 7) + (s >> 1) + sfn.charCodeAt(i)) & 0xFF; return s; };
    const table = d => {
        const b = new Uint8Array(d === root ? 32 * 512 : Math.ceil(d.entries * 32 / cb) * cb);
        let at = 0;
        if (d === root) { ascii(b, 0, label.toUpperCase().padEnd(11).slice(0, 11)); b[11] = 0x08; at = 32; }
        else {
            entry(b, 0, '.          ', 0x10, d.cluster, 0);
            entry(b, 32, '..         ', 0x10, d.parent === root ? 0 : d.parent.cluster, 0);
            at = 64;
        }
        for (const k of d.kids.values()) {
            const sum = checksum(k.sfn);
            for (let n = k.lfn; n >= 1; n--) {
                const dv = new DataView(b.buffer, at, 32);
                b[at] = n | (n === k.lfn ? 0x40 : 0);
                b[at + 11] = 0x0F; b[at + 13] = sum;
                const spots = [1, 3, 5, 7, 9, 14, 16, 18, 20, 22, 24, 28, 30];
                spots.forEach((off, i) => {
                    const ci = (n - 1) * 13 + i;
                    dv.setUint16(off, ci < k.name.length ? k.name.charCodeAt(ci) : ci === k.name.length ? 0 : 0xFFFF, true);
                });
                at += 32;
            }
            entry(b, at, k.sfn, k.dir ? 0x10 : 0x20, k.cluster, k.dir ? 0 : k.data.length);
            at += 32;
        }
        return b;
    };
    // boot sector
    const boot = new Uint8Array(512), bv = new DataView(boot.buffer);
    boot.set([0xEB, 0x3C, 0x90]); ascii(boot, 3, 'MSDOS5.0');
    bv.setUint16(11, 512, true); boot[13] = L.spc; bv.setUint16(14, 1, true); boot[16] = 1; bv.setUint16(17, 512, true);
    bv.setUint16(19, sectors < 65536 ? sectors : 0, true); boot[21] = 0xF8; bv.setUint16(22, L.fat, true);
    bv.setUint16(24, 63, true); bv.setUint16(26, 255, true); bv.setUint32(32, sectors < 65536 ? 0 : sectors, true);
    boot[36] = 0x80; boot[38] = 0x29; bv.setUint32(39, (now.getTime() / 1000) >>> 0, true);
    ascii(boot, 43, label.toUpperCase().padEnd(11).slice(0, 11)); ascii(boot, 54, 'FAT16   ');
    boot[510] = 0x55; boot[511] = 0xAA;
    const fatBytes = new Uint8Array(L.fat * 512);
    for (let c = 0; c < fat.length; c++) { fatBytes[2 * c] = fat[c] & 0xFF; fatBytes[2 * c + 1] = fat[c] >> 8; }
    const runs = [[0, boot], [1, fatBytes], [1 + L.fat, table(root)]];
    const at = c => L.dataStart + (c - 2) * L.spc;
    for (const d of dirs) runs.push([at(d.cluster), table(d)]);
    for (const k of all) if (!k.dir && k.data.length) {
        const b = new Uint8Array(Math.ceil(k.data.length / cb) * cb);
        b.set(k.data);
        runs.push([at(k.cluster), b]);
    }
    return {runs, used: (next - 2) * cb, size: L.clusters * cb, sectors};
}

// Two UF2 "files", sent one after the other: the firmware, then the drive. (Tested on the pad: the
// boot ROM takes a file's blocks only near where that file starts, so one file can't hold both the
// firmware at 0 and the drive 1 MB in.) The firmware's file claims one block more than it has, so
// the ROM never counts it as finished; the drive's file is a new, complete one, and the ROM
// restarts the chip once it has all of it. {fw, drive}: whole 512-byte blocks.
function makeUf2(fwUf2, runs) {
    const fw = [], drive = [];
    const dv = new DataView(fwUf2.buffer, fwUf2.byteOffset, fwUf2.byteLength);
    for (let o = 0; o + 512 <= fwUf2.length; o += 512) {
        if (dv.getUint32(o, true) !== 0x0A324655 || dv.getUint32(o + 4, true) !== 0x9E5D5157 || dv.getUint32(o + 508, true) !== 0x0AB16F30) throw new Error('the firmware file isn\'t a UF2');
        const flags = dv.getUint32(o + 8, true), addr = dv.getUint32(o + 12, true), size = dv.getUint32(o + 16, true);
        if (flags & 1) continue;                                    // "not main flash"
        if (!(flags & 0x2000) || dv.getUint32(o + 28, true) !== UF2_FAMILY) throw new Error('the firmware isn\'t for an RP2040');
        if (size !== 256 || addr + 256 > FS_BASE - 4096) throw new Error('the firmware is too big for the space before the drive');
        fw.push([addr, fwUf2.subarray(o + 32, o + 32 + 256)]);
    }
    for (const [sector, bytes] of runs)
        for (let off = 0; off < bytes.length; off += 256) drive.push([FS_BASE + sector * 512 + off, bytes.subarray(off, off + 256)]);
    return {fw: uf2File(fw, fw.length + 1), drive: uf2File(drive, drive.length)};
}
function uf2File(pages, total) {
    const out = new Uint8Array(pages.length * 512), ov = new DataView(out.buffer);
    pages.forEach(([addr, data], i) => {
        const o = i * 512;
        ov.setUint32(o, 0x0A324655, true); ov.setUint32(o + 4, 0x9E5D5157, true); ov.setUint32(o + 8, 0x2000, true);
        ov.setUint32(o + 12, addr, true); ov.setUint32(o + 16, 256, true); ov.setUint32(o + 20, i, true);
        ov.setUint32(o + 24, total, true); ov.setUint32(o + 28, UF2_FAMILY, true);
        out.set(data, o + 32);
        ov.setUint32(o + 508, 0x0AB16F30, true);
    });
    return out;
}
async function sha1(bytes) {
    const h = new Uint8Array(await crypto.subtle.digest('SHA-1', bytes));
    return [...h].map(b => b.toString(16).padStart(2, '0')).join('');
}

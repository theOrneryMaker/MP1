<script>
// ─── The full update (the app only): read the pad over its serial console (any firmware, even a broken one),
// save a backup to the phone, plan the new drive (plan.html), then one flash through the boot ROM (fwimage.html).
// A stopped update is finished from update mode: Restore from a backup…. From FIRMWARE_04's phone page. ───
const CON_CHUNK = 6144;                         // bytes per console read (8 KB of base64)
const FLASH_BPS = 60 * 1024;                    // the boot ROM's speed, about (for the time estimate)
const FU = {busy: false, plan: null, con: null, pkgs: null, picked: null};
const wait = ms => new Promise(r => setTimeout(r, ms));
const kb = n => n < 1024 ? n + ' bytes' : (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB';

// The serial console (raw REPL: the pad's program stops, and the console runs Python)
class Console {
    constructor(p) { this.p = p; this.buf = ''; this.dead = false; }
    async open() {
        await this.p.open({baudRate: 115200});
        try { await this.p.setSignals({dataTerminalReady: true}); } catch (e) { /* not needed everywhere */ }
        this.w = this.p.writable.getWriter();
        this.r = this.p.readable.getReader();
        (async () => {
            const dec = new TextDecoder();
            try { for (;;) { const {value, done} = await this.r.read(); if (done) break; this.buf += dec.decode(value, {stream: true}); } }
            catch (e) { /* closed */ }
            this.dead = true;
        })();
    }
    send(s) { return this.w.write(new TextEncoder().encode(s)); }
    async until(test, ms, why) {
        const end = Date.now() + ms;
        while (!test(this.buf)) {
            if (this.dead) throw new Error('The pad went away.');
            if (Date.now() > end) throw new Error(why);
            await wait(5);
        }
    }
    async enter() {
        await this.send('\r\x03\x03');
        await wait(600);
        this.buf = '';
        await this.send('\x01');
        try { await this.until(b => b.includes('raw REPL; CTRL-B to exit'), 2500, ''); }
        catch (e) {
            if (this.dead) throw e;
            await this.send('\x03\x03\x01');
            await this.until(b => b.includes('raw REPL; CTRL-B to exit'), 4000, 'The pad\'s console didn\'t answer.');
        }
        await wait(100);
    }
    async run(code, ms = 20000) {
        this.buf = '';
        await this.send(code + '\x04');
        await this.until(b => b.length >= 2 && (!b.startsWith('OK') || ((b.match(/\x04/g) || []).length >= 2 && b.endsWith('>'))), ms, 'The pad stopped answering.');
        if (!this.buf.startsWith('OK')) throw new Error('The console said: ' + this.buf.slice(0, 120));
        const [body, err] = this.buf.slice(2).split('\x04');
        if (err.trim()) throw new Error(err.trim().split('\n').pop());
        return body;
    }
    async close(reload) {
        try { await this.send('\x02'); if (reload) await this.send('\x04'); } catch (e) { /* gone */ }
        try { await this.r.cancel(); } catch (e) { /* gone */ }
        try { this.w.releaseLock(); } catch (e) { /* gone */ }
        try { await this.p.close(); } catch (e) { /* gone */ }
    }
}
const py = s => JSON.stringify(s);             // a Python string literal
const PY_INFO = `import os, board, microcontroller, storage
s = os.statvfs('/')
print(board.board_id)
print(microcontroller.cpu.uid.hex())
print(s[1], s[2])
print(storage.getmount('/').label)
print(os.uname().version)
print(hasattr(microcontroller, 'RunMode') and hasattr(microcontroller.RunMode, 'UF2'))`;
const PY_WALK = `import os
def w(p):
 for n in os.listdir('/' + p):
  q = p + n
  s = os.stat('/' + q)
  if s[0] & 0x4000:
   print('D|' + q)
   if q.lower() not in ('lib', 'toolkit', 'app', 'system volume information', '.fseventsd', 'lost.dir'): w(q + '/')
  else: print('F|' + str(s[6]) + '|' + q)
w('')`;
async function consoleFile(con, path, size, onBytes) {
    const out = new Uint8Array(size);
    let off = 0;
    await con.run(`import binascii\nf = open(${py('/' + path)}, 'rb')`);
    try {
        while (off < size) {
            const b = b64Bytes((await con.run(`print(binascii.b2a_base64(f.read(${CON_CHUNK})).decode().strip())`)).trim());
            if (!b.length) break;
            out.set(b.subarray(0, size - off), off);
            off += b.length;
            onBytes(b.length);
        }
    } finally { await con.run('f.close()').catch(() => {}); }
    if (off < size) throw new Error(`${path} came back short`);
    return out;
}
// the pad's console port: the first port of the pad the Link was on (or of any pad plugged in)
async function consolePort() {
    const dev = Link.port && Link.port.key ? Link.port.key.split('#')[0] : null;
    let ports = await MP1Serial.getPorts();
    if (!ports.length) { if (!await MP1Serial.allow().catch(() => false)) return null; ports = await MP1Serial.getPorts(); }
    return ports.find(p => p.info.index === 0 && (!dev || p.key.startsWith(dev + '#'))) || null;
}

// the update packages: the app's own (assets/firmware) and one picked from the phone
async function loadPkgs() {
    if (!FU.pkgs) {
        FU.pkgs = [];
        for (const n of JSON.parse(APP.assets('firmware')).filter(n => /\.zip$/i.test(n)).sort()) {
            try { FU.pkgs.push(await readPackage(b64Bytes(APP.asset('firmware/' + n)), 'built into the app')); } catch (e) { /* not a package */ }
        }
    }
    return FU.picked ? [FU.picked, ...FU.pkgs] : FU.pkgs;
}
const fwName = fw => /^ember(\d+)$/i.test(String(fw)) ? 'Ember ' + String(fw).slice(5) : 'firmware ' + fw;
const pkgName = p => `MP1 ${fwName(p.info.fw)} for ${p.info.board} (${p.source}${p.info.built ? ', built ' + p.info.built : ''})`;
async function drawPkgs() {
    const list = await loadPkgs();
    $('fuPkg').innerHTML = list.length
        ? '<div class="rows">' + list.map(p => `<div><strong>${esc(pkgName(p))}</strong></div>`).join('') + '</div>'
        : '<p class="warn">No update package in this app: use another update package….</p>';
}
const pkgFor = async boardId => (await loadPkgs()).find(p => (p.info.board_ids || []).includes(boardId));

const setStep = (step, state, note) => { step[1] = state; step[2] = note; };     // (in place: a restore shows a slice)
// steps on screen: [title, state ('' / 'now' / 'ok' / 'bad'), note (HTML)]
function fuSteps(steps, extra = '') {
    const mark = {ok: '✓ ', bad: '✗ ', now: '… ', '': ''};
    $('fuOut').innerHTML = '<div class="rows">' + steps.map(([t, s, n]) =>
        `<div><strong class="${s === 'ok' ? 'good' : s === 'bad' ? 'bad' : ''}">${mark[s] || ''}${esc(t)}</strong>${n ? `<br><span class="hint">${n}</span>` : ''}</div>`).join('') + '</div>' + extra;
}
const bar = (done, total) => `<div class="bar"><i style="width:${(100 * done / total).toFixed(1)}%"></i></div>`;
const mins = s => s < 90 ? (Math.round(s) <= 1 ? '1 second' : Math.round(s) + ' seconds') : Math.round(s / 60) + ' minutes';

// 1. Check: read everything, save the backup, plan the update. Nothing is changed on the pad.
async function fuCheck(backupOnly) {
    if (FU.busy) return;
    FU.busy = true; FU.plan = null; render();
    const S = [['Read the pad', 'now', ''], ['Save a backup to the phone', '', '']].concat(backupOnly ? [] : [['Convert your keymap and files', '', ''], ['Make the update', '', '']]);
    const show = (extra = '') => fuSteps(S, extra);
    show();
    let con = null;
    try {
        Link.paused = true;
        if (Link.port) await Link.close();
        const p = await consolePort();
        if (!p) throw new Error('No pad plugged in (or MP1 isn\'t allowed to use it).');
        con = new Console(p);
        await con.open();
        await con.enter();
        const [boardId, uid, frsize, blocks, label, version, canUf2] = (await con.run(PY_INFO)).trim().split(/\r?\n/).flatMap((l, i) => i === 2 ? l.split(' ') : [l.trim()]);
        const flashMB = flashFromStatvfs(+frsize, +blocks);
        if (!flashMB) throw new Error(`Can't tell this board's flash size (drive: ${blocks} × ${frsize} bytes).`);
        const pkg = backupOnly ? null : await pkgFor(boardId);
        if (!backupOnly && !pkg) throw new Error(`No update package for this board (${boardId}). Use another update package… made for it.`);
        const listing = (await con.run(PY_WALK, 60000)).trim().split(/\r?\n/).filter(Boolean);
        const want = [], dirs = [];
        for (const line of listing) {
            const [k, a, b] = line.trim().split('|');
            const path = k === 'D' ? a : b;
            if (/^(lib|toolkit|app|system volume information|\.fseventsd|lost\.dir)(\/|$)/i.test(path)) continue;
            if (k === 'D') dirs.push(path); else want.push([path, +a]);
        }
        const total = want.reduce((n, f) => n + f[1], 0) || 1;
        let got = 0;
        const files = {};
        for (const [path, size] of want) {
            S[0][2] = `${esc(path)}<br>${kb(got)} of ${kb(total)}` + bar(got, total);
            show();
            files[path] = await consoleFile(con, path, size, n => { got += n; });
        }
        S[0] = ['Read the pad', 'ok', `${esc(boardId)} · ${flashMB} MB flash · drive “${esc(label)}” · ${want.length} files, ${kb(total)} · CircuitPython ${esc(version)}`];
        // 2. the backup (what's on the pad now, before anything is changed)
        S[1][1] = 'now'; show();
        const name = `MP1_full_backup_${label.replace(/[^\w-]+/g, '_')}_${new Date().toISOString().slice(0, 10)}.json`;
        const bk = {mp1_backup: 1, full: true, made: new Date().toISOString(), board_id: boardId, flash_mb: flashMB, label, uid, circuitpython: version,
                    dirs, files: Object.fromEntries(Object.entries(files).map(([p, b]) => [p, bytesB64(b)]))};
        await savePhone(name, new TextEncoder().encode(JSON.stringify(bk)), 'application/json');
        S[1] = ['Save a backup to the phone', 'ok', `${esc(name)} in Downloads. Keep it until the pad works.`];
        if (backupOnly) {
            show('<p class="good"><strong>Done.</strong> The pad is starting again.</p>');
            await con.close(true); con = null;
            return;
        }
        // 3. convert (nothing is sent yet)
        S[2][1] = 'now'; show();
        const plan = await planEmber(pkg, files, dirs, uid);
        S[2] = ['Convert your keymap and files', 'ok', plan.notes.map(esc).join('<br>') || 'Nothing to change.'];
        // 4. the update itself
        S[3][1] = 'now'; show();
        const img = fatImage(plan.files, flashMB, label);
        const uf2 = makeUf2(pkg.uf2, img.runs);
        const size = uf2.fw.length + uf2.drive.length;
        S[3] = ['Make the update', 'ok', `${esc(pkgName(pkg))}<br>Drive: ${kb(img.used)} used of ${kb(img.size)}. Sending ${kb(size)} takes about ${mins(size / 2 / FLASH_BPS)}.`];
        FU.plan = {uf2, pkg, canUf2: canUf2 === 'True'};
        FU.con = con; con = null;                       // stays paused in its console until Update or Cancel
        show(`<div class="warn"><strong>Wipe and update?</strong> The pad restarts in update mode, gets Ember and your files, then starts by itself. Keep the cable in until it's back.${FU.plan.canUf2 ? '' : '<br><strong>This firmware can\'t restart into update mode by itself:</strong> when asked, hold the board\'s BOOT button while you unplug and replug it.'}</div>` +
             '<button class="primary" id="fuGoBtn">Wipe and update</button><button id="fuCancelBtn">Cancel</button>');
        $('fuGoBtn').onclick = fuGo;
        $('fuCancelBtn').onclick = fuCancel;
    } catch (err) {
        const i = S.findIndex(s => s[1] === 'now');
        if (i >= 0) S[i] = [S[i][0], 'bad', esc(err.message)];
        show('<p class="hint">Nothing was changed on the pad.</p>');
        if (con) await con.close(true);
    } finally {
        FU.busy = !!FU.plan;
        if (!FU.busy) { Link.paused = false; setTimeout(() => Link.autoConnect().then(render), 2500); }
        render();
    }
}
async function fuCancel() {
    FU.plan = null;
    if (FU.con) { await FU.con.close(true); FU.con = null; }
    FU.busy = false; Link.paused = false;
    $('fuOut').innerHTML = '<p class="hint">Cancelled: nothing was changed. The pad is starting again.</p>';
    render();
    setTimeout(() => Link.autoConnect().then(render), 2500);
}

// 2. Go: into update mode, send the two UF2 files, wait for the pad to come back
async function fuGo() {
    if (!FU.plan) return;
    const {uf2, pkg} = FU.plan;
    FU.plan = null;
    FU.busy = true; render();
    const S = [['Restart into update mode', 'now', ''], ['Send Ember and your files', '', ''], ['Check it started', '', '']];
    const show = (extra = '') => fuSteps(S, extra);
    show();
    try {
        if (FU.con) {
            await FU.con.send('import microcontroller\r\nmicrocontroller.on_next_reset(microcontroller.RunMode.UF2)\r\nmicrocontroller.reset()\x04').catch(() => {});
            await wait(300);
            await FU.con.close(false);
            FU.con = null;
        }
        await flashBoot(uf2, S, show);
        await waitBack(pkg, S, show);
    } catch (err) {
        const i = S.findIndex(s => s[1] === 'now');
        if (i >= 0) S[i] = [S[i][0], 'bad', esc(err.message)];
        show('<p class="hint">Your backup is in Downloads. If the pad is still in update mode, Restore from a backup… finishes the job; otherwise unplug it, hold the BOOT button while you plug it back in, then Restore.</p>');
    } finally { FU.busy = false; Link.paused = false; render(); fuBootCheck(); }
}
// update mode (RPI-RP2) -> the two files sent. S[0] = the restart step, S[1] = sending.
async function flashBoot(uf2, S, show) {
    let state = 'none';
    for (let i = 0; i < 100 && state === 'none'; i++) { state = APP.bootDrive(); if (state === 'none') await wait(300); }
    if (state === 'none') throw new Error('The pad didn\'t show up in update mode. Unplug it, hold the BOOT button while you plug it back in, then Restore from a backup….');
    if (state === 'noperm') {
        S[0][2] = 'Allow MP1 to use “RP2 Boot”.'; show();
        if (!await MP1Serial.allowBoot()) throw new Error('Not allowed to use the update drive.');
    }
    setStep(S[0], 'ok', '');
    S[1][1] = 'now'; show();
    const why = APP.uf2Open();
    if (why) throw new Error(why);
    const total = uf2.fw.length + uf2.drive.length, t0 = Date.now();
    let lba = 4096, sent = 0;
    try {
        for (const part of [uf2.fw, uf2.drive]) {
            for (let off = 0; off < part.length; off += 32768) {
                const chunk = part.subarray(off, off + 32768);
                const err = APP.uf2Write(lba, bytesB64(chunk));
                const last = part === uf2.drive && off + 32768 >= part.length;
                if (err && !last) throw new Error(err);      // (the last one may be cut short by the restart)
                lba += chunk.length / 512; sent += chunk.length;
                const left = (Date.now() - t0) / sent * (total - sent) / 1000;
                S[1][2] = `${kb(sent)} of ${kb(total)}${sent > 65536 ? ' · about ' + mins(left) + ' left' : ''}` + bar(sent, total);
                show();
                await wait(0);
            }
        }
    } finally { APP.uf2Close(); }
    setStep(S[1], 'ok', `${kb(total)} in ${mins((Date.now() - t0) / 1000)}.`);
}
async function waitBack(pkg, S, show) {
    S[2][1] = 'now'; S[2][2] = 'Waiting for the pad to start (allow MP1 to use it if Android asks)…'; show();
    Link.paused = false;
    for (let i = 0; i < 90 && !Link.pad; i++) {
        if (i % 6 === 2 && !Link.port) await Link.connectNew().catch(() => {});
        await wait(1000);
    }
    const pad = Link.pad;
    if (!pad) throw new Error('It didn\'t come back within a minute and a half. Unplug it and plug it back in; if it still doesn\'t start, Restore from a backup….');
    const bad = (pad.errors || []).length;
    setStep(S[2], bad ? 'bad' : 'ok', `${esc(fwName(pad.fw))}${String(pad.fw) === String(pkg.info.fw) ? '' : ` (expected ${esc(fwName(pkg.info.fw))})`} · ` +
           `${(pad.layers || []).length} layers · ` + (bad ? 'start-up problems: ' + pad.errors.map(esc).join('; ') : 'no start-up problems'));
    show(bad ? '' : '<p class="good"><strong>Done.</strong> MP1 Ember.html is on the pad\'s drive too, for changes on a computer.</p>');
    phLoad();
}

// In update mode already (a stopped update, or the BOOT button): finish from a backup file
function fuBootCheck() {
    if (!APP || !$('fuBoot')) return;
    $('fuBoot').hidden = FU.busy || APP.bootDrive() === 'none';
}
async function fuRestore(file) {
    if (FU.busy) return;
    FU.busy = true; render();
    const S = [['Read the backup', 'now', ''], ['Make the update', '', ''], ['Restart into update mode', '', ''], ['Send Ember and your files', '', ''], ['Check it started', '', '']];
    const show = () => fuSteps(S);
    show();
    try {
        let bk;
        try { bk = JSON.parse(await file.text()); } catch (e) { throw new Error('That isn\'t a backup file (not JSON).'); }
        if (!bk || !bk.mp1_backup || !bk.files) throw new Error('That isn\'t an MP1 backup.');
        if (!bk.flash_mb || !bk.board_id) throw new Error('This backup doesn\'t say which board it\'s from: use one made by this app (MP1_full_backup_….json).');
        const files = Object.fromEntries(Object.entries(bk.files).map(([p, s]) => [p, b64Bytes(s)]));
        S[0] = ['Read the backup', 'ok', `${esc(file.name)}: ${Object.keys(files).length} files from ${esc(bk.label || '?')} (${esc(bk.board_id)}), ${esc((bk.made || '').slice(0, 10))}`];
        S[1][1] = 'now'; show();
        const pkg = await pkgFor(bk.board_id);
        if (!pkg) throw new Error(`No update package for ${bk.board_id}.`);
        if (!bk.uid) throw new Error('This backup has no chip ID (made by an older app): its secret layers couldn\'t be kept. Use a newer backup.');
        const plan = await planEmber(pkg, files, bk.dirs || [], bk.uid);
        const img = fatImage(plan.files, bk.flash_mb, bk.label || 'CIRCUITPY');
        const uf2 = makeUf2(pkg.uf2, img.runs);
        S[1] = ['Make the update', 'ok', esc(pkgName(pkg)) + (plan.notes.length ? '<br>' + plan.notes.map(esc).join('<br>') : '')];
        const rest = S.slice(2);
        await flashBoot(uf2, rest, show);
        await waitBack(pkg, rest, show);
    } catch (err) {
        const i = S.findIndex(s => s[1] === 'now');
        if (i >= 0) S[i] = [S[i][0], 'bad', esc(err.message)];
        show();
    } finally { FU.busy = false; Link.paused = false; render(); fuBootCheck(); }
}
</script>

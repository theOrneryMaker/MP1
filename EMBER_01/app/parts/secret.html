<script>
// ─── Secret pages: secret.json, encrypted to the pad's chip (AES-CTR, as FIRMWARE_04; keymap.py reads it) ───
// {"mp1_secret": 1, "iv": hex, "data": base64}; inside: a JSON list of the pages (Ember layers, up to 4),
// padded with spaces. On the pad "Secret pages" opens page 1 and the encoder turns the pages. The key comes from the connected pad ({"c": "skey"}), so the file can only be read or written with that
// pad on the cable. In the editor the secret layers come after HOLD+KEY; any change saves the whole file (encrypted)
// and the pad reads it again. A FIRMWARE_04 file is converted when the pad's keymap is (openold.html).
const SECRETS = {list: [], locked: '', present: false, converted: false,     // list: the pages, in order
    pin: null, needPin: false, pinNote: '', pinForm: false};                   // pin: the PIN, once typed here (needPin: asked for)
const PIN_OK = /^[1-8]{4,8}$/;              // (the pad's keys 1-8 type the digits)
// the key for pages with a PIN (keymap.pin_key on the pad): "MP1 PIN " + the digits, one AES block encrypted with the
// chip's key (AES-CBC with a zero IV gives the same first block as the pad's ECB)
async function pinKey(base, pin) {
    const block = new TextEncoder().encode(('MP1 PIN ' + pin + '        ').slice(0, 16));
    const k = await crypto.subtle.importKey('raw', base, 'AES-CBC', false, ['encrypt']);
    return new Uint8Array(await crypto.subtle.encrypt({name: 'AES-CBC', iv: new Uint8Array(16)}, k, block)).slice(0, 16);
}
const hasPin = text => { try { return JSON.parse(text).pin === true; } catch (e) { return false; } };
const MAX_SECRET = 4;
const renumberSecrets = () => SECRETS.list.forEach((L, i) => { L.secret = i + 1; });
const hexBytes = h => Uint8Array.from((h || '').match(/../g) || [], x => parseInt(x, 16));
const bytesHex = b => [...b].map(x => x.toString(16).padStart(2, '0')).join('');
const b64Bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const bytesB64 = b => { let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(s); };
async function aesCtr(key, iv, data, encrypt) {
    const k = await crypto.subtle.importKey('raw', key, 'AES-CTR', false, [encrypt ? 'encrypt' : 'decrypt']);
    return new Uint8Array(await crypto.subtle[encrypt ? 'encrypt' : 'decrypt']({name: 'AES-CTR', counter: iv, length: 128}, k, data));
}
async function padSecretKey() {
    const r = await Link.request({c: 'skey'});
    const k = hexBytes(r.key);
    if (k.length !== 16) throw new Error('the pad gave no key');
    return k;
}
// secret.json text -> the list inside (throws if this key can't open it)
async function secretOpen(text, key) {
    const d = JSON.parse(text);
    const plain = await aesCtr(key, hexBytes(d.iv), b64Bytes(d.data), false);
    const list = JSON.parse(new TextDecoder().decode(plain));
    if (!Array.isArray(list)) throw new Error('not a list');
    return list;
}
async function secretText(list, key, pin) {
    let bytes = new TextEncoder().encode(JSON.stringify(list));
    const pad = (16 - bytes.length % 16) % 16;                  // (spaces: still valid JSON)
    if (pad) { const p = new Uint8Array(bytes.length + pad).fill(32); p.set(bytes); bytes = p; }
    const iv = crypto.getRandomValues(new Uint8Array(16));
    return JSON.stringify(Object.assign({mp1_secret: 1}, pin ? {pin: true} : {}, {iv: bytesHex(iv), data: bytesB64(await aesCtr(key, iv, bytes, true))})) + '\n';
}
// an old (FIRMWARE_04) secret layer -> Ember (the same converter as the keymap's)
function secretFromOld(old, n) {
    if (!old || typeof old !== 'object') return null;
    if (old.ember === 'layer') return old;
    return emberLayerFromOld(old, 'SECRET ' + n);
}
// the pad's key from its chip ID (hex), as keymap.secret_key: "MP1 secret layer" XOR the ID (the phone reads the ID
// over the console; the page asks the pad, padSecretKey)
const SECRET_SALT = 'MP1 secret layer';
function secretKeyFromUid(uidHex) {
    const uid = hexBytes(uidHex), salt = new TextEncoder().encode(SECRET_SALT);
    if (!uid.length) throw new Error('no chip ID');
    return Uint8Array.from({length: 16}, (_, i) => salt[i] ^ uid[i % uid.length]);
}
const secretLayer = (n, data) => data ? {secret: n, file: null, data} : null;

// read the pad's secret.json (after its keymap): SECRETS.list
async function loadSecrets(oldText) {
    Object.assign(SECRETS, {list: [], locked: '', present: false, converted: false, needPin: false});
    let text = oldText;
    if (text == null) {
        try { text = await Link.readText('secret.json'); }
        catch (e) { if (e.notFound) return; SECRETS.locked = 'secret.json couldn\'t be read: ' + e.message; return; }
    }
    SECRETS.present = true;
    let list;
    if (hasPin(text) && !SECRETS.pin) { SECRETS.needPin = true; return; }          // (secretBox asks for it)
    try { list = await secretOpen(text, hasPin(text) ? await pinKey(await padSecretKey(), SECRETS.pin) : await padSecretKey()); }
    catch (e) {
        if (hasPin(text)) { SECRETS.pin = null; SECRETS.needPin = true; SECRETS.pinNote = 'That isn\'t the PIN.'; return; }
        SECRETS.locked = 'secret.json can\'t be opened with this pad (made on another one?). It\'s left as it is.'; return;
    }
    SECRETS.pinNote = '';
    for (const d of list) {                 // (an old file's Secret 1 and Secret 2 become pages 1 and 2)
        if (!d || SECRETS.list.length >= MAX_SECRET) continue;
        if (d.ember !== 'layer') SECRETS.converted = true;
        const L = secretLayer(SECRETS.list.length + 1, secretFromOld(d, SECRETS.list.length + 1));
        if (L) SECRETS.list.push(L);
    }
}
// write them all (encrypted), then the pad reads its keymap again
async function saveSecrets() {
    const base = await padSecretKey(), pin = SECRETS.pin;
    const text = await secretText(SECRETS.list.map(L => L.data), pin ? await pinKey(base, pin) : base, !!pin);
    Link.send({c: 'sync', on: true});
    try {
        await Link.writeText('secret.json', text);
        const answer = Link.waitFor(x => x.t === 'reloaded', 10000);
        Link.send({c: 'reload', show: Link.pad && !Link.pad.secret ? Link.pad.layer : null});
        const m = await answer;
        if (!m) return {t: 'error', msg: 'The pad didn\'t answer.'};
        SECRETS.converted = false;
        return m.errors && m.errors.length ? {t: 'error', msg: m.errors.join('; ')} : {t: 'keyok', saved: true};
    } finally {
        Link.send({c: 'sync', on: false});
    }
}
// a secret layer added / deleted from the page
function addSecret() {
    if (SECRETS.list.length >= MAX_SECRET) return;
    const n = SECRETS.list.length + 1;
    const L = secretLayer(n, {ember: 'layer', name: 'SECRET ' + n, keys: [null, null, null, null, null, null, null, null], encoder: {label: ''}});
    SECRETS.list.push(L);
    SEL.layer = kmAll().indexOf(L); SEL.key = 'layer';
    secretsChanged();
}
function deleteSecret(L) {
    SECRETS.list = SECRETS.list.filter(x => x !== L);
    renumberSecrets();
    SEL.layer = 0; SEL.key = 'layer';
    secretsChanged();
}
async function secretsChanged() {
    renderEditor();
    if (!Link.port || KM.pending) { LIVE.state = 'offline'; LIVE.note = 'Not connected: kept in this page.'; liveBar(); return; }
    await whenIdle();
    LIVE.busy = true; LIVE.state = 'sending'; liveBar();
    try { liveResult(await saveSecrets()); } catch (e) { LIVE.state = 'error'; LIVE.note = e.message; }
    LIVE.busy = false;
    liveBar();
    pump();
}
// ─── the PIN pad: the pad's 8 keys as they sit (two rows of four, no numbers: you remember the pattern). The pad's own
// keys work too while it shows (link "pinpad": the pad sends the presses here and types nothing). 'set': twice, to
// check; 'open': to show the secret pages here. ───
const PINPAD = {mode: null, digits: '', first: '', note: ''};
function pinPadOpen(mode) {
    Object.assign(PINPAD, {mode, digits: '', first: '', note: mode === 'open' ? 'Enter the PIN' : 'Press a new PIN: 4-8 keys'});
    pinPadSync();
    secretBox();
}
function pinPadClose(tellPad = true) {
    PINPAD.mode = null;
    PINPAD.digits = PINPAD.first = '';
    if (tellPad && Link.port) Link.send({c: 'pinpad', on: false});
    secretBox();
}
function pinPadSync() { if (Link.port && PINPAD.mode) Link.send({c: 'pinpad', on: true, dots: PINPAD.digits.length, note: PINPAD.note}); }
function pinPadPress(k) {
    if (PINPAD.digits.length >= 8) return;
    PINPAD.digits += String(k + 1);
    pinPadSync(); secretBox();
}
function pinPadBack() { PINPAD.digits = PINPAD.digits.slice(0, -1); pinPadSync(); secretBox(); }
async function pinPadEnter() {
    const d = PINPAD.digits;
    if (d.length < 4) { PINPAD.note = 'At least 4 keys'; pinPadSync(); secretBox(); return; }
    if (PINPAD.mode === 'open') {
        SECRETS.pin = d;
        pinPadClose();
        await loadSecrets();
        if (SECRETS.needPin) { pinPadOpen('open'); PINPAD.note = 'That isn\'t the PIN'; pinPadSync(); secretBox(); return; }
        renderEditor();
    } else if (!PINPAD.first) {
        Object.assign(PINPAD, {first: d, digits: '', note: 'Again, to check'});
        pinPadSync(); secretBox();
    } else if (d !== PINPAD.first) {
        Object.assign(PINPAD, {first: '', digits: '', note: 'They didn\'t match: start again'});
        pinPadSync(); secretBox();
    } else {
        SECRETS.pin = d;
        pinPadClose();
        secretsChanged();
    }
}
function pinPadHtml() {
    const n = PINPAD.digits.length;
    return `<div class="msg pinpad"><b>${esc(PINPAD.note)}</b>
        <div class="pinkeys">${[0, 1, 2, 3, 4, 5, 6, 7].map(k => `<button class="pinkey" type="button" data-pk="${k}" aria-label="Key ${k + 1}"></button>`).join('')}</div>
        <div class="pindots" aria-label="${n} pressed">${'●'.repeat(n)}${'○'.repeat(Math.max(0, 4 - n))}</div>
        <div class="row"><button class="btn small" type="button" data-pinact="back">Back</button>
          <button class="btn small main" type="button" data-pinact="ok">OK</button>
          <button class="btn small" type="button" data-pinact="cancel">Cancel</button></div>
        <span class="sub">Click the keys here, or press them on the pad itself (it types nothing while this shows).</span></div>`;
}
function pinPadWire(el) {
    el.querySelectorAll('[data-pk]').forEach(b => b.onclick = () => pinPadPress(+b.dataset.pk));
    el.querySelectorAll('[data-pinact]').forEach(b => b.onclick = () => {
        const a = b.dataset.pinact;
        if (a === 'back') pinPadBack(); else if (a === 'ok') pinPadEnter(); else pinPadClose();
    });
}
Link.on(m => {
    if (m.t === 'hello' && $('editor') && !$('editor').hidden) secretBox();      // (the pad read its keymap again)
    if (!PINPAD.mode) return;
    if (m.t === 'pinkey') pinPadPress(m.k);
    else if (m.t === 'pinback') pinPadBack();
    else if (m.t === 'pinenter') pinPadEnter();
    else if (m.t === 'pinclose') pinPadClose(false);
    else if (m.t === 'closed') pinPadClose(false);
});

// the Layers column: + Secret layer / why they can't be shown
function secretBox() {
    const box = $('secretBox');
    if (!box) return;
    if (SECRETS.needPin && Link.port) {         // pages with a PIN: asked once here (as the pad asks once after power-up)
        box.innerHTML = PINPAD.mode === 'open' ? pinPadHtml()
            : `<div class="msg">Secret pages: locked with a PIN. <button class="btn small" type="button" id="pinAsk">Enter the PIN…</button>
               <span class="sub bad">${esc(SECRETS.pinNote)}</span></div>`;
        if ($('pinAsk')) $('pinAsk').onclick = () => pinPadOpen('open');
        pinPadWire(box);
        return;
    }
    // the page has secret pages the pad didn't load (it says why): read them again without a replug
    const p = Link.pad;
    const unloaded = p && SECRETS.list.length && p.secret_pages === 0 && !p.secret_pin && !KM.pending;
    const free = !SECRETS.locked && SECRETS.list.length < MAX_SECRET && Link.port && !KM.pending;
    box.innerHTML = (unloaded ? `<div class="msg warn">The pad hasn't loaded its secret pages (${esc(p.secret_note || '?')}).
          <button class="btn small" type="button" id="secretReload">Reload them</button></div>` : '')
        + (SECRETS.locked ? `<div class="msg warn">Secret pages: ${esc(SECRETS.locked)}</div>`
        : SECRETS.converted ? '<div class="msg warn">The secret layers are from the old firmware: converted to pages here. <button class="btn small" type="button" id="secretSave">Save them to the pad</button></div>'
        : free ? '<button class="btn small" type="button" id="secretAdd" title="The Secret pages pad function (a gesture or a key) opens page 1; the encoder turns the pages. Never listed on the pad or sent to the player.">+ Secret page</button>' : '');
    if ($('secretReload')) $('secretReload').onclick = async () => {
        $('secretReload').disabled = true;
        const answer = Link.waitFor(m => m.t === 'reloaded', 10000);
        Link.send({c: 'reload', show: Link.pad && !Link.pad.secret ? Link.pad.layer : null});
        await answer;
        await Link.waitFor(m => m.t === 'hello', 3000);
        secretBox();
    };
    if ($('secretAdd')) $('secretAdd').onclick = addSecret;
    if ($('secretSave')) $('secretSave').onclick = secretsChanged;
    // the PIN: optional; set, change or remove it (the pad asks for it the first time after it's plugged in)
    if (!SECRETS.locked && SECRETS.list.length && Link.port && !KM.pending) {
        const pinRow = document.createElement('div');
        pinRow.className = 'row wrap';
        pinRow.style.marginTop = '6px';
        pinRow.innerHTML = PINPAD.mode === 'set' ? pinPadHtml()
            : `<span class="sub">${SECRETS.pin ? 'PIN: on (the pad asks once after it\'s plugged in)' : 'PIN: off'}</span>
               <button class="btn small" type="button" id="pinForm">${SECRETS.pin ? 'Change PIN…' : 'Set a PIN…'}</button>
               ${SECRETS.pin ? '<button class="btn small" type="button" id="pinOff">Remove the PIN</button>' : ''}`;
        box.appendChild(pinRow);
        if ($('pinForm')) $('pinForm').onclick = () => pinPadOpen('set');
        if ($('pinOff')) $('pinOff').onclick = () => { SECRETS.pin = null; secretsChanged(); };
        pinPadWire(pinRow);
    }
}
</script>

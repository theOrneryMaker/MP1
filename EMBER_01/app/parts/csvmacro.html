<script>
// ─── Macros from a CSV (or rows pasted from Excel) ───
// The first row says what happens AFTER each column; every row below is typed in turn:
//     Part {TAB},Qty {TAB 2},Unit {TAB 3},Plant {ENTER}{WAIT 0.3}
//     4471-220,12,EA,Plant 3
// A cell's text is typed, then its column's tokens run. Tokens work inside any cell too ({CTRL+A}Plant 3).
// Tokens: a key ({TAB}, {ENTER}, {F5}...), a key and a count ({TAB 3}), a combo ({CTRL+SHIFT+V}), a wait
// ({WAIT 0.5}, seconds), a media key ({PLAYPAUSE}). {{ and }} type a brace. Comma, semicolon or Tab separated.
const CSV_KEYS = {CTRL: 'CONTROL', CONTROL: 'CONTROL', SHIFT: 'SHIFT', ALT: 'ALT', WIN: 'GUI', WINDOWS: 'GUI', GUI: 'GUI', CMD: 'GUI',
    ESC: 'ESCAPE', ESCAPE: 'ESCAPE', ENTER: 'ENTER', RETURN: 'ENTER', TAB: 'TAB', SPACE: 'SPACE', UP: 'UP_ARROW', DOWN: 'DOWN_ARROW',
    LEFT: 'LEFT_ARROW', RIGHT: 'RIGHT_ARROW', PGUP: 'PAGE_UP', PAGEUP: 'PAGE_UP', PGDN: 'PAGE_DOWN', PAGEDOWN: 'PAGE_DOWN',
    DEL: 'DELETE', DELETE: 'DELETE', BS: 'BACKSPACE', BKSP: 'BACKSPACE', BACKSPACE: 'BACKSPACE', INS: 'INSERT', INSERT: 'INSERT',
    HOME: 'HOME', END: 'END', MENU: 'APPLICATION', PRTSC: 'PRINT_SCREEN', PRINTSCREEN: 'PRINT_SCREEN', CAPSLOCK: 'CAPS_LOCK'};
const CSV_WAIT = ['WAIT', 'PAUSE', 'DELAY', 'SLEEP'];
const CSV_MAX_WAIT = 60, CSV_MAX_TIMES = 999;

function csvKeyName(t) {
    const u = t.toUpperCase().replace(/\s+/g, '');
    if (CSV_KEYS[u]) return CSV_KEYS[u];
    if (/^[A-Z]$/.test(u)) return u;
    if (/^[0-9]$/.test(u)) return DIGITS[+u];
    if (/^F([1-9]|1[0-9]|2[0-4])$/.test(u)) return u;
    if (KEY_GROUPS.some(g => g[1].includes(u))) return u;          // (the pad's own names: PAGE_DOWN, KEYPAD_ONE...)
    return null;
}
// one {token} -> a macro step (or several: a key with a gap, {F7 49 0.2}), or throws why
function csvToken(tok) {
    const t0 = tok.trim();
    if (/^DATE$/i.test(t0)) return {stamp: 'MM/DD/YYYY'};
    if (/^TIME$/i.test(t0)) return {stamp: 'h:mm AMPM'};
    let mm;
    if ((mm = /^DATE\s+(.+)$/i.exec(t0))) return {stamp: normalStamp(mm[1].trim())};     // (+180 at the end: days from today)
    if ((mm = /^NEXT\s+([A-Za-z0-9 _-]{1,16})$/i.exec(t0))) return {number: mm[1].trim().toUpperCase()};
    if ((mm = /^PAUSE(?:\s+(.+))?$/i.exec(t0))) {                  // waits for a click (the note shows on the pad)
        const note = (mm[1] || 'Paused').trim().slice(0, 60);
        if ([...note].some(ch => ch < ' ' || ch > '~')) throw new Error(`{${t0}}: the note can only use the letters, numbers and symbols on a US keyboard`);
        return {pause: note};
    }
    const t = t0, m = /^(.*?)(?:\s+(\d+(?:\.\d+)?)(?:\s+(\d+(?:\.\d+)?))?)?$/.exec(t), name = m[1].trim(), n = m[2], gap = m[3];
    if (CSV_WAIT.includes(name.toUpperCase())) {
        const s = +n;
        if (!n || !(s > 0) || s > CSV_MAX_WAIT) throw new Error(`{${t}}: give the seconds, like {WAIT 0.5} (up to ${CSV_MAX_WAIT})`);
        return {delay: Math.round(s * 100) / 100};
    }
    const times = n ? +n : 1;
    if (n && (!Number.isInteger(times) || times < 1 || times > CSV_MAX_TIMES)) throw new Error(`{${t}}: the count should be 1-${CSV_MAX_TIMES}`);
    if (gap !== undefined) {                // {F7 49 0.2}: 49 presses, 0.2 s apart (for a page that needs a moment after each)
        const g = +gap;
        if (!(g > 0) || g > CSV_MAX_WAIT) throw new Error(`{${t}}: the gap is in seconds, like {F7 49 0.2} (up to ${CSV_MAX_WAIT})`);
        const one = csvToken(name);
        const out = [];
        for (let i = 0; i < times; i++) { if (i) out.push({delay: Math.round(g * 100) / 100}); out.push(Object.assign({}, one)); }
        return out;
    }
    if (MEDIA_WORDS[name.toUpperCase()]) return Object.assign({media: name.toUpperCase()}, times > 1 ? {times} : {});
    const parts = name.split('+').map(p => p.trim()).filter(Boolean);
    if (!parts.length) throw new Error(`{${t}}: empty`);
    const keys = parts.map(p => { const k = csvKeyName(p); if (!k) throw new Error(`{${t}}: unknown key "${p}"`); return k; });
    if (keys.length > 4) throw new Error(`{${t}}: at most 4 keys together`);
    const step = keys.length === 1 ? {key: keys[0]} : {combo: keys.filter(k => MOD_OF[k]).concat(keys.filter(k => !MOD_OF[k]))};
    if (times > 1) step.times = times;
    return step;
}
// a cell -> steps (its text and its tokens, in order)
function csvCell(s) {
    const out = [];
    let text = '', i = 0;
    while (i < s.length) {
        const c = s[i];
        if (c === '{' && s[i + 1] === '{') { text += '{'; i += 2; continue; }
        if (c === '}' && s[i + 1] === '}') { text += '}'; i += 2; continue; }
        if (c === '{') {
            const j = s.indexOf('}', i);
            if (j < 0) throw new Error('a { without its }');
            if (text) { out.push({text}); text = ''; }
            const st = csvToken(s.slice(i + 1, j));
            out.push(...(Array.isArray(st) ? st : [st]));
            i = j + 1;
            continue;
        }
        text += c; i++;
    }
    if (text) out.push({text});
    return out;
}
// CSV text -> rows of cells (quotes as Excel writes them; the separator found from the first line)
function csvRows(text) {
    text = text.replace(/^﻿/, '').replace(/\r\n?/g, '\n');
    // the separator: the one on the most lines (not just the first: a one-column "Setup" header has none). Ties: Tab
    // (an Excel paste), then semicolon (Excel where the comma is the decimal point), then comma. No separator at all: comma.
    const lines = text.split('\n').filter(l => l.trim()).slice(0, 200);
    let sep = ',', most = 0;
    for (const c of ['\t', ';', ',']) {
        const n = lines.filter(l => l.includes(c)).length;
        if (n > most) { sep = c; most = n; }
    }
    const rows = [];
    let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (q) {
            if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
            else if (c === '"') q = false;
            else cell += c;
        } else if (c === '"' && cell === '') q = true;
        else if (c === sep) { row.push(cell); cell = ''; }
        else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
        else cell += c;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return {rows: rows.filter(r => r.some(c => c.trim() !== '')), sep};
}
// the whole file -> {steps, sections: [{row, rows, cols, after, head}], rows, cols, after, head (the first section's),
// problems, seconds}. Sections: a row whose first cell starts with {HEADER} is a new header (e.g. an order's top form
// once, then its lines in a second form); the rows under it use it until the next {HEADER} row.
const CSV_HEADER = /^\s*\{header\}/i;
const CSV_FOOTER = /^\s*\{footer\}/i;         // a row of keys run once after everything (e.g. Save, Submit)
const CSV_COMMENT = /^\s*#/;                   // a note in the file: skipped
function csvMacro(text) {
    const {rows, sep} = csvRows(text);
    const problems = [], sections = [], footers = [];
    let firstRow = true;
    rows.forEach((r, i) => {
        if (CSV_COMMENT.test(r[0] || '')) return;
        if (CSV_FOOTER.test(r[0] || '')) { footers.push([i + 1, [String(r[0]).replace(CSV_FOOTER, '')].concat(r.slice(1))]); return; }
        if (firstRow || CSV_HEADER.test(r[0] || '')) sections.push({row: i + 1, head: [String(r[0] || '').replace(CSV_HEADER, '')].concat(r.slice(1)), data: []});
        else sections[sections.length - 1].data.push([i + 1, r]);
        firstRow = false;
    });
    if (!sections.length || !sections.some(s => s.data.length))
        return {steps: [], sections: [], rows: 0, cols: 0, after: [], problems: ['The first row says what follows each column; the rows under it are typed. There are no rows to type.'], sep};
    const steps = [], total = sections.reduce((n, s) => n + s.data.length, 0);
    let done = 0;
    for (const sec of sections) {
        sec.cols = Math.max(sec.head.length, ...sec.data.map(([, r]) => r.length));
        const used = c => (sec.head[c] || '').trim() || sec.data.some(([, r]) => (r[c] || '').trim());
        while (sec.cols > 1 && !used(sec.cols - 1)) sec.cols--;        // (Excel writes empty columns at the end: not counted)
        sec.after = [];
        for (let c = 0; c < sec.cols; c++) {
            try { sec.after.push(csvCell(sec.head[c] || '').filter(s => s.text == null)); }      // (a header's words are only its name)
            catch (e) { problems.push(`Row ${sec.row}, column ${c + 1}: ${e.message}`); sec.after.push([]); }
        }
        if (!sec.data.length) problems.push(`Row ${sec.row}: a header with no rows under it`);
        let inSection = 0;
        for (const [rowNo, r] of sec.data) {
            steps.push({mark: [++done, total]});    // (the pad's progress screen: "Row 37 of 80")
            inSection++;
            for (let c = 0; c < sec.cols; c++) {
                try {
                    const cell = csvCell(String(r[c] || '').replace(/\{ROW\}/gi, String(inSection)));     // {ROW}: this row's number
                    for (const s of cell) {             // (the pad types with a US keyboard layout: plain characters only)
                        const bad = s.text != null && [...s.text].find(ch => ch < ' ' || ch > '~');
                        if (bad) throw new Error(`the pad can't type “${bad}” (only the letters, numbers and symbols on a US keyboard)`);
                    }
                    steps.push(...cell);
                } catch (e) { problems.push(`Row ${rowNo}, column ${c + 1}: ${e.message}`); }
                steps.push(...sec.after[c].map(s => Object.assign({}, s)));
            }
        }
        sec.rows = sec.data.length;
        delete sec.data;
    }
    for (const [rowNo, cells] of footers) {          // {FOOTER} rows: once, after all the rows
        cells.forEach((cell, c) => {
            try { steps.push(...csvCell(cell || '')); }
            catch (e) { problems.push(`Row ${rowNo}, column ${c + 1}: ${e.message}`); }
        });
    }
    const merged = [];                      // text next to text joins; the same key again counts up
    for (const s of steps) {
        const p = merged[merged.length - 1];
        if (p && s.text != null && p.text != null) p.text += s.text;
        else if (p && !s.text && !p.text && s.delay == null && JSON.stringify(Object.assign({}, p, {times: undefined})) === JSON.stringify(Object.assign({}, s, {times: undefined})))
            p.times = Math.min(CSV_MAX_TIMES, (p.times || 1) + (s.times || 1));
        else merged.push(s);
    }
    let seconds = 0;
    for (const s of merged) seconds += s.delay != null ? s.delay : s.text != null ? s.text.length * 0.012 : s.mark ? 0 : 0.02 * (s.times || 1);
    const first = sections[0];
    return {steps: merged, sections, rows: sections.reduce((n, s) => n + s.rows, 0), cols: first.cols, after: first.after, head: first.head, problems, seconds, sep};
}
// the examples (the same as EMBER_01/examples/*.csv): Help's download buttons and the builder's starter
const CSV_EXAMPLES = {order: ['example - material order.csv', 'Part number {TAB},Quantity {TAB 2},Unit {TAB 3},Plant {ENTER}{WAIT 0.5}\r\n4471-220,12,EA,Plant 3\r\n4471-221,6,EA,Plant 3\r\n4471-222,40,FT,Plant 3\r\n5520-118,2,EA,Plant 1\r\n5520-119,150,FT,Plant 1\r\n"6011-004, rev B",1,EA,Plant 2\r\n'],
    form: ['example - repeated form.csv', 'Customer {TAB}{WAIT 0.3},PO number {TAB},Ship date {TAB}{WAIT 0.3},Ship via {DOWN}{ENTER}{TAB},Notes {CTRL+S}{WAIT 1.5}{ALT+N}{WAIT 2}\r\nAcme Supply,PO-88213,11/24/2026,UPS,Leave at dock 4\r\nNorthline Electric,PO-88214,11/25/2026,FedEx,\r\nBayview Mechanical,PO-88215,11/25/2026,UPS,Call before delivery\r\n'],
    twoforms: ['example - two forms per record.csv', 'Customer {TAB},PO {TAB},Date {TAB},Ship via {TAB},Terms {TAB},Rep {TAB},Notes {TAB 2}{WAIT 0.5},Part {TAB},Qty {TAB},Unit {TAB},Price {TAB},Plant {CTRL+S}{WAIT 1.5}{ALT+N}{WAIT 2}\r\nAcme Supply,PO-88213,11/24/2026,UPS,Net 30,JC,Dock 4,4471-220,12,EA,4.10,Plant 3\r\nNorthline Electric,PO-88214,11/25/2026,FedEx,Net 30,JC,,5520-118,2,EA,18.50,Plant 1\r\nBayview Mechanical,PO-88215,11/25/2026,UPS,Net 45,AR,Call first,6011-004,1,EA,240.00,Plant 2\r\n'],
    sections: ['example - order header and lines.csv', 'Customer {TAB},PO {TAB},Date {TAB},Ship via {TAB},Terms {TAB},Rep {TAB},Notes {TAB 2}{WAIT 0.5},,,,\r\nAcme Supply,PO-88213,11/24/2026,UPS,Net 30,JC,Dock 4,,,,\r\n{HEADER}Part {TAB},Qty {TAB},Unit {TAB},Price {TAB},Plant {ENTER}{WAIT 1},,,,,,\r\n4471-220,12,EA,4.10,Plant 3,,,,,,\r\n4471-221,6,EA,2.75,Plant 3,,,,,,\r\n4471-222,40,FT,0.90,Plant 3,,,,,,\r\n5520-118,2,EA,18.50,Plant 1,,,,,,\r\n5520-119,150,FT,1.15,Plant 1,,,,,,\r\n"6011-004, rev B",1,EA,240.00,Plant 2,,,,,,\r\n{HEADER}Finish,,,,,,,,,,\r\n{CTRL+S}{WAIT 2},,,,,,,,,,\r\n']};
const CSV_SAMPLE = CSV_EXAMPLES.order[1];
document.addEventListener('click', e => { const b = e.target.closest('[data-example]'); if (b) downloadText(...CSV_EXAMPLES[b.dataset.example]); });
function openCsvHelp() {                    // Help, at the CSV guide
    document.querySelector('[data-view=helpView]').click();
    $('helpCsv').open = true;               // (it's folded away under Macros)
    setTimeout(() => $('helpCsv').scrollIntoView({block: 'start'}), 0);
}
const stepWord = s => { const d = describe(s); return (d[1].length ? d[1].join('+') : d[0] === 'Wait' ? 'wait ' + s.delay + ' s' : d[0]) + (s.times > 1 ? ' ×' + s.times : ''); };

// the builder, inside the macro editor: paste or open a file, see what it makes, then use it
function csvBuilder(box, text) {
    const host = box.querySelector('#csvBox') || box.appendChild(Object.assign(document.createElement('div'), {id: 'csvBox'}));
    host.className = 'csvbox';
    host.innerHTML = `<div class="row"><b>Macro from a CSV</b><span class="sub" style="margin-left:auto"><a href="#" id="csvHelp">How it works</a> · <a href="#" id="csvSample">Download an example</a></span></div>
        <span class="sub">First row: what follows each column, like <code>Part {TAB}</code> or <code>Plant {ENTER}{WAIT 0.3}</code>. Each row under it is typed in turn.
          Keys: {TAB} {ENTER} {DOWN} {F5}…, {TAB 3} for three, {CTRL+S} for a combo, {WAIT 0.5} for a pause.</span>
        <textarea class="field" id="csvText" rows="6" spellcheck="false" placeholder="Paste from Excel, or open a .csv file">${esc(text || '')}</textarea>
        <div class="row"><button class="btn small" type="button" id="csvOpen">Open a .csv file…</button><input type="file" id="csvFile" accept=".csv,.txt,text/csv" hidden></div>
        <div id="csvPreview"></div>`;
    const preview = () => {
        const t = $('csvText').value;
        if (!t.trim()) { $('csvPreview').innerHTML = ''; return; }
        const r = csvMacro(t);
        const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
        const chips = sec => sec.after.map((a, c) => `<span class="chip">${esc((sec.head[c] || '').replace(/\{[^}]*\}/g, '').trim() || 'column ' + (c + 1))} → ${a.length ? esc(a.map(stepWord).join(', ')) : 'nothing'}</span>`).join(' ');
        const secs = r.sections || [];
        $('csvPreview').innerHTML = `${secs.map((sec, i) => `${secs.length > 1 ? `<div class="sub"><b>Section ${i + 1}</b> (row ${sec.row}): ${plural(sec.rows, 'row')} × ${plural(sec.cols, 'column')}</div>` : ''}
              <div class="row">${chips(sec)}</div>`).join('')}
            ${r.problems.length ? `<div class="msg bad">${r.problems.slice(0, 6).map(esc).join('<br>')}${r.problems.length > 6 ? '<br>…and ' + (r.problems.length - 6) + ' more' : ''}</div>` : ''}
            ${r.steps.length ? `<div class="sub">${secs.length > 1 ? plural(secs.length, 'section') + ' · ' : ''}${plural(r.rows, 'row')}${secs.length > 1 ? '' : ' · ' + plural(r.cols, 'column')} · ${r.steps.length} steps · types in about ${Math.max(1, Math.round(r.seconds))} s</div>
            <div class="row"><button class="btn main" type="button" id="csvReplace" ${r.problems.length ? 'disabled' : ''}>Replace the macro</button>
              <button class="btn" type="button" id="csvAppend" ${r.problems.length ? 'disabled' : ''}>Add to the end</button>
              <button class="btn" type="button" id="csvCancel">Close</button></div>` : '<div class="row"><button class="btn" type="button" id="csvCancel">Close</button></div>'}`;
        const use = replace => { const l = (replace ? [] : macroSteps()).concat(r.steps); setSteps(l); host.remove(); macroForm(box, l); };
        if ($('csvReplace')) $('csvReplace').onclick = () => use(true);
        if ($('csvAppend')) $('csvAppend').onclick = () => use(false);
        $('csvCancel').onclick = () => host.remove();
    };
    $('csvText').oninput = preview;
    $('csvOpen').onclick = () => $('csvFile').click();
    $('csvFile').onchange = async () => { const f = $('csvFile').files[0]; if (f) { $('csvText').value = await f.text(); preview(); } };
    $('csvSample').onclick = e => { e.preventDefault(); downloadText(...CSV_EXAMPLES.order); };
    $('csvHelp').onclick = e => { e.preventDefault(); openCsvHelp(); };
    preview();
    host.scrollIntoView({block: 'nearest'});
}
function downloadText(name, text) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], {type: 'text/plain'}));
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
</script>

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.theornerymaker.mp1'
    compileSdk 36

    defaultConfig {
        applicationId 'com.theornerymaker.mp1'
        minSdk 29                   // Android 10: Downloads without a storage permission
        targetSdk 36
        versionCode 7
        versionName '1.3 Ember'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.github.mik3y:usb-serial-for-android:3.9.0'
}
